[project]
name = "gowri-proj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shravan Chandra", email = "52000043+shravnchandr@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "xlwt>=1.3.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "db",
    "output",
    "uploads",
]

[tool.ruff.lint]
# Default rule set (pyflakes + subset of pycodestyle) plus a small,
# uncontroversial set of extras: isort (import sorting) and pyupgrade
# (modern-syntax suggestions). Not opinionated beyond this — further
# strictness is a policy decision for humans.
extend-select = ["I", "UP"]
