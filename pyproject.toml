[project]
name = "janhavi-medical-inventory-management"
version = "0.1.0"
description = "Local-first pharmacy inventory dashboard: imports monthly/daily POS stock statements into SQLite and tracks stock health (out-of-stock, low-stock, dead-stock, overstock), ABC value segmentation, and sales trends — no data leaves the machine."
readme = "README.md"
authors = [
    { name = "Shravan Chandra", email = "52000043+shravnchandr@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# uv_build defaults to deriving the src/ module directory name from
# [project].name (hyphens -> underscores) — that would expect
# src/janhavi_medical_inventory_management/, but the actual package
# has always lived at src/gowri_proj/. Point the build backend at the
# real module instead of renaming the whole package/import tree just to
# match a display-name change.
module-name = "gowri_proj"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "xlwt>=1.3.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "db",
    "output",
    "uploads",
]

[tool.ruff.lint]
# Default rule set (pyflakes + subset of pycodestyle) plus a small,
# uncontroversial set of extras: isort (import sorting) and pyupgrade
# (modern-syntax suggestions). Not opinionated beyond this — further
# strictness is a policy decision for humans.
extend-select = ["I", "UP"]
